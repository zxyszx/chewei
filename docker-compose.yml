services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: parking_manager
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 中设置 POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - parking_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking_manager"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: parking-space-manager-app:latest
    build:
      context: .
      args:
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?请设置 NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://parking:${POSTGRES_PASSWORD}@db:5432/parking_manager
      AUTH_SECRET: ${AUTH_SECRET:?请设置 AUTH_SECRET}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?请设置 NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请设置 ENCRYPTION_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      UPDATE_REPOSITORY: ${UPDATE_REPOSITORY:-zxyszx/parking-space-manager}
      UPDATE_BRANCH: ${UPDATE_BRANCH:-main}
      WEB_UPDATE_ENABLED: ${WEB_UPDATE_ENABLED:-false}
      UPDATE_REQUEST_FILE: /app/control/update.request
      UPDATE_STATUS_FILE: /app/control/update-status.json
      TZ: Asia/Shanghai
    volumes:
      - ./data/control:/app/control
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  parking_postgres_data:
